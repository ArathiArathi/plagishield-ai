<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A0E1A" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="96" y1="48" x2="416" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="160" y1="128" x2="352" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="190" y1="140" x2="322" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F0F9FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#shieldBg)" />
  <rect width="512" height="512" rx="120" stroke="url(#shieldBorder)" stroke-width="8" stroke-opacity="0.45" />

  <!-- Shield Silhouette -->
  <path d="M256 76L388 122C388 248 338 368 256 436C174 368 124 248 124 122L256 76Z" 
        fill="url(#coreGlow)" fill-opacity="0.18" />
  <path d="M256 76L388 122C388 248 338 368 256 436C174 368 124 248 124 122L256 76Z" 
        stroke="url(#shieldBorder)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central AI Neural Spark -->
  <g filter="url(#glow)">
    <path d="M256 142C256 206 272 222 336 222C272 222 256 238 256 302C256 238 240 222 176 222C240 222 256 206 256 142Z" 
          fill="url(#sparkGrad)" />
  </g>

  <!-- Verified Check Crest -->
  <path d="M206 288L244 326L316 248" 
        stroke="#10B981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M206 288L244 326L316 248" 
        stroke="#A7F3D0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neural Orbit Dots -->
  <circle cx="256" cy="116" r="7" fill="#38BDF8" />
  <circle cx="356" cy="222" r="6" fill="#818CF8" />
  <circle cx="256" cy="358" r="6" fill="#A78BFA" />
  <circle cx="156" cy="222" r="6" fill="#38BDF8" />
</svg>
