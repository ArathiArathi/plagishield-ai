<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoBorder" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="40" y1="30" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="aiBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="26" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="2.5" />
    <path d="M50 16L78 26C78 52 67.5 76 50 90C32.5 76 22 52 22 26L50 16Z" 
          fill="#3B82F6" fill-opacity="0.12" stroke="url(#logoBorder)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- AI Spark -->
    <path d="M50 30C50 43 54 47 67 47C54 47 50 51 50 64C50 51 46 47 33 47C46 47 50 43 50 30Z" fill="url(#sparkGrad)" />
    <!-- Verified Check -->
    <path d="M40 60L48 68L62 52" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 26)">
    <!-- Brand Title -->
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
      Plagi<tspan fill="#38BDF8">Shield</tspan>
    </text>

    <!-- AI Pill Badge -->
    <g transform="translate(232, 14)">
      <rect width="52" height="34" rx="8" fill="url(#aiBadgeGrad)" />
      <text x="26" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.05em">
        AI
      </text>
    </g>

    <!-- Tagline -->
    <text x="2" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.16em">
      ACADEMIC INTEGRITY INTELLIGENCE
    </text>
  </g>
</svg>
